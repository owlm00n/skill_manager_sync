# ── Skill 分组标签 ─────────────────────────

tags:
  debug: ["bug-core", "bug-logs", "bug-workspace", "log-analyzer", "code-generator"]
  management: ["skill-manager", "session-manager", "hook-manager", "memory-manager", "permission-manager"]
  protocol: ["protocol-parser", "bug-core"]
