# Skills Sync Manager Configuration
# ====================================

# 同步模式: symlink | junction | copy
# symlink: 需要管理员权限，junction: 无需权限（推荐），copy: 独立副本
default_mode: junction

# ── Preset 预设 ──────────────────────────────
presets:
  debug-toolkit:
    description: "Updated desc"
    skills: ["bug-core"]
  protocol-dev:
    description: "协议开发工具包"
    skills: ["protocol-parser", "bug-core", "keyword-vault"]
  management:
    description: "管理员工具包"
    skills: ["skill-manager", "session-manager", "hook-manager", "memory-manager", "permission-manager"]
  all:
    description: "所有技能"
    skills: ["apply-comments", "bug-core", "bug-hub", "bug-logs", "bug-workspace", "cc-hub", "code-generator", "create-slide", "create-theme", "current-slide", "find-skills", "hello-skill", "hook-manager", "isupport-downloader", "keyword-vault", "log-analyzer", "memory-manager", "pd_auth_analyse", "permission-manager", "Powerpoint-PPTX", "protocol-parser", "session-manager", "skill-manager", "slide-authoring", "ui-style", "Unisoc-PPT"]
# ── Agent 目标配置 ─────────────────────────
  bug:
    description: "bughub"
    skills: ["bug-core", "bug-hub", "bug-logs", "bug-workspace", "isupport-downloader", "keyword-vault", "log-analyzer", "protocol-parser"]

agents:
  trae_cn_auto:
    tool: trae_cn
    path: "C:/Users/xianjun.zeng/.trae-cn/skills"
    active_presets: ["debug-toolkit"]
    skills: ["*"]

  hermes_auto:
    tool: hermes
    path: "C:/Users/xianjun.zeng/.hermes/skills"
    active_presets: ["debug-toolkit", "bug"]
    skills: ["*"]

  qoder_auto:
    tool: qoder
    path: "C:/Users/xianjun.zeng/.qoder/skills"
    active_presets: ["debug-toolkit"]
    skills: ["*"]

  claude_code_global:
    tool: claude_code
    path: "C:/Users/xianjun.zeng/.claude/skills"
    active_presets: ["management", "all"]
    skills: ["*"]

  # 项目级（按需取消注释）
  # claude_code_project_a:
  #   tool: claude_code
  #   path: "d:/06_Project/projectA/.claude/skills"
  #   active_presets: ["debug-toolkit"]
  #   skills: ["bug-core", "log-analyzer"]

  # 其他工具（按需取消注释）
  # cursor_global:
  #   tool: cursor
  #   path: "C:/Users/xianjun.zeng/.cursor/skills"
  #   active_presets: []
