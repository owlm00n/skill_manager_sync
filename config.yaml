# ── Skill 分组标签 ─────────────────────────

tags:
  bug-core: ["debug"]
  bug-logs: ["debug"]
  bug-workspace: ["debug"]
  log-analyzer: ["debug"]
  code-generator: ["debug"]
  protocol-parser: ["protocol"]
  keyword-vault: ["debug"]
  skill-manager: ["management"]
  session-manager: ["management"]
  hook-manager: ["management"]
  memory-manager: ["management"]
  permission-manager: ["management"]
